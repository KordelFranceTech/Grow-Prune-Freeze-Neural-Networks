# Experiment 11b: Same as exp11 (64-wide, 4-layer max, depth+sparsity) but with
# episode_length=100s and max_steps=1200 to allow the agent more time to navigate.
#
# Motivation: exp11's best policy (94.5%) trained on 50s episodes. In harder
# starting configurations (agent far from source, weak signal), 50s is not always
# enough for the agent to locate the source. Doubling the episode budget gives the
# policy more time to execute casting/surging strategies without timing out.
#
# All other hyperparameters identical to exp11.

name: exp11b_longer_episode
seed: 42

experiment:
  n_episodes: 5000
  eval_every: 500
  notes: >
    Exp11 retrained with episode_length=100s (2x longer). Agent has 1200 steps
    instead of 600 to locate the source, reducing timeout rate on harder starts.

simulator:
  dt: 0.1
  episode_length: 100
  domain_size: [20.0, 20.0]
  source_position: random
  source_strength: 5.0
  filament:
    diffusion_rate: 0.05
    decay_time: 30.0
    initial_radius: 0.01
    mass: 0.1
  wind:
    type: ornstein_uhlenbeck
    mean_speed: 1.0
    mean_direction: 0.0
    direction_volatility: 15.0
    speed_volatility: 0.2
    correlation_time: 2.0
  sensors:
    antenna_separation: 0.1
    antenna_forward_offset: 0.08
    noise_floor_sigma: 0.001
    saturation: 1.0
  agent:
    forward_speed: 0.5
    turn_rate: 90.0
    cast_amplitude: 30.0
  success_radius: 0.5

tokenization:
  vocabulary_version: v1
  concentration_bin_edges: [3.0, 6.0, 15.0, 45.0, 150.0, 600.0]
  wind_n_octants: 8
  wind_zero_threshold: 0.05
  actions:
    - forward
    - turn_left_15
    - turn_right_15
    - turn_around
    - cast_left
    - cast_right

rl_agent:
  algorithm: expected_sarsa_nn
  network:
    hidden_dim: 64
    learning_rate: 1.0e-3
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.9995
  n_episodes: 5000
  max_steps_per_episode: 1200
  eval_every_episodes: 500
  output_dir: checkpoints/gpf/
  reward:
    source_found: 100.0
    time_penalty: -0.01
    whiff_bonus: 1.0
    blank_penalty: -0.05
    whiff_threshold_multiplier: 3.0
    blank_penalty_duration: 2.0
    distance_shaping: 2.0

gpf_agent:
  output_dir: checkpoints/gpf/
  grow:
    eps_add: 0.05
    M_add: 6
    cooldown_episodes: 400
    min_episodes_before_grow: 400
    max_hidden_layers: 4
    ema_beta: 0.9
    use_eval_trigger_only: true
  belief:
    tau_belief_harden: 0.02
    tau_belief_prune: 0.3
  prune:
    tau_prune: 1.0e-6
    prune_accum_steps: 1500
  freeze:
    tau_freeze_delta: 0.01
    tau_freeze_frac: 0.9
    freeze_check_interval: 300
    freeze_patience: 3
    min_episodes_before_freeze: 99999
