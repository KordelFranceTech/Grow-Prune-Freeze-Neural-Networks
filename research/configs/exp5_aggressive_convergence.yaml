# Experiment 5: 64-wide, lower lr (5e-4), 4000 episodes.
#
# Exp 2: 64-wide, lr=1e-3, 3000 eps → 91% best (peak ep 2500, decline to 87% by ep 3000)
# Exp 4: 128-wide, lr=1e-3, 3000 eps → 85.5% best (policy oscillated: 85.5%→51.5%→83%)
#
# Hypothesis: The ep2500→3000 decline in exp2 (91%→87%) and the steeper oscillation in
# exp4 both point to lr=1e-3 being too large for stable long-run convergence.
# lr=5e-4 reduces step size → more stable optimization → policy holds its peak longer.
# 4000 episodes gives time to converge fully (ε≈0.135 at ep4000 vs 0.223 at ep3000).
#
# Target: 92%+ by staying at the good policy rather than oscillating past it.

name: exp5_lower_lr_longer
seed: 42

experiment:
  n_episodes: 4000
  eval_every: 500
  notes: >
    64-wide, lr=5e-4 (half of exp2), 4000 episodes. Same env as exp2.
    Tests whether lower lr stabilizes the policy at/above 91% for longer,
    enabling the extra 1000 episodes to push best success rate above 91%.

simulator:
  dt: 0.1
  episode_length: 50
  domain_size: [20.0, 20.0]
  source_position: random
  source_strength: 5.0
  filament:
    diffusion_rate: 0.05
    decay_time: 30.0
    initial_radius: 0.01
    mass: 0.1
  wind:
    type: ornstein_uhlenbeck
    mean_speed: 1.0
    mean_direction: 0.0
    direction_volatility: 15.0
    speed_volatility: 0.2
    correlation_time: 2.0
  sensors:
    antenna_separation: 0.1
    antenna_forward_offset: 0.08
    noise_floor_sigma: 0.001
    saturation: 1.0
  agent:
    forward_speed: 0.5
    turn_rate: 90.0
    cast_amplitude: 30.0
  success_radius: 0.5

tokenization:
  vocabulary_version: v1
  concentration_bin_edges: [3.0, 6.0, 15.0, 45.0, 150.0, 600.0]
  wind_n_octants: 8
  wind_zero_threshold: 0.05
  actions:
    - forward
    - turn_left_15
    - turn_right_15
    - turn_around
    - cast_left
    - cast_right

rl_agent:
  algorithm: expected_sarsa_nn
  network:
    hidden_dim: 64
    learning_rate: 5.0e-4          # half of exp2 → more stable optimization
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.9995
  n_episodes: 4000
  max_steps_per_episode: 600
  eval_every_episodes: 500
  output_dir: checkpoints/gpf/
  reward:
    source_found: 100.0
    time_penalty: -0.01
    whiff_bonus: 1.0
    blank_penalty: -0.05
    whiff_threshold_multiplier: 3.0
    blank_penalty_duration: 2.0
    distance_shaping: 2.0

gpf_agent:
  output_dir: checkpoints/gpf/
  grow:
    eps_add: 0.03
    M_add: 6
    cooldown_episodes: 500
    min_episodes_before_grow: 99999   # no grows
    max_hidden_layers: 6
    ema_beta: 0.9
    use_eval_trigger_only: true
  belief:
    tau_belief_harden: 0.02
    tau_belief_prune: 0.3
  prune:
    tau_prune: 1.0e-6
    prune_accum_steps: 1200
  freeze:
    tau_freeze_delta: 0.01
    tau_freeze_frac: 0.9
    freeze_check_interval: 300
    freeze_patience: 3
    min_episodes_before_freeze: 99999  # no freeze — let policy adapt freely
