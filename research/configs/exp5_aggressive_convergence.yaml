# Experiment 5: Aggressive convergence configuration.
#
# Takes the best-performing settings from exp3/exp4 and pushes harder:
# - Higher learning rate (5e-3) with tighter gradient clipping
# - Longer episode budget within the same training time by increasing
#   episode_length to 200 steps (20s at 10Hz) so the agent has more
#   time to actually reach the source per episode
# - Stronger time penalty to push efficiency
# - Source strength increased so the plume is denser and easier to detect

name: exp5_aggressive_convergence
seed: 42

experiment:
  n_episodes: 3000
  eval_every: 500
  notes: >
    Longer episodes (200 steps = 20s) give the agent more time to reach the
    source per episode. Higher lr=5e-3 with aggressive convergence.
    Stronger source (strength=2.0) for denser plume, easier early learning.
    Best GPF settings from prior experiments combined.

simulator:
  dt: 0.1
  episode_length: 200            # 20 seconds per episode (vs 50 = 5s default)
  domain_size: [20.0, 20.0]
  source_position: random
  source_strength: 2.0           # denser plume → easier early detection
  filament:
    diffusion_rate: 0.05
    decay_time: 30.0
    initial_radius: 0.01
    mass: 0.1
  wind:
    type: ornstein_uhlenbeck
    mean_speed: 1.0
    mean_direction: 0.0
    direction_volatility: 15.0
    speed_volatility: 0.2
    correlation_time: 2.0
  sensors:
    antenna_separation: 0.1
    antenna_forward_offset: 0.08
    noise_floor_sigma: 0.001
    saturation: 1.0
  agent:
    forward_speed: 0.5
    turn_rate: 90.0
    cast_amplitude: 30.0
  success_radius: 0.5

tokenization:
  vocabulary_version: v1
  concentration_bin_edges: [3.0, 6.0, 15.0, 45.0, 150.0, 600.0]
  wind_n_octants: 8
  wind_zero_threshold: 0.05
  actions:
    - forward
    - turn_left_15
    - turn_right_15
    - turn_around
    - cast_left
    - cast_right

rl_agent:
  algorithm: expected_sarsa_nn
  network:
    hidden_dim: 128
    learning_rate: 5.0e-3        # aggressive lr
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.999
  n_episodes: 3000
  max_steps_per_episode: 600
  eval_every_episodes: 500
  output_dir: checkpoints/gpf/
  reward:
    source_found: 100.0
    time_penalty: -0.02          # stronger time penalty for efficiency
    whiff_bonus: 0.5
    blank_penalty: -0.1          # stronger blank penalty
    whiff_threshold_multiplier: 3.0
    blank_penalty_duration: 1.5  # start penalizing blanks sooner

gpf_agent:
  output_dir: checkpoints/gpf/
  grow:
    eps_add: 0.008
    M_add: 30
    cooldown_episodes: 400       # longer cooldown with longer episodes
    min_episodes_before_grow: 600
    max_hidden_layers: 6
    ema_beta: 0.9
  belief:
    tau_belief_harden: 0.02
    tau_belief_prune: 0.3
  prune:
    tau_prune: 1.0e-8
    prune_accum_steps: 600
  freeze:
    tau_freeze_delta: 0.01
    tau_freeze_frac: 0.85        # slightly more lenient freeze criterion
    freeze_check_interval: 200
    freeze_patience: 3
    min_episodes_before_freeze: 300
