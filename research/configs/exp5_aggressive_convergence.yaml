# Experiment 5: Best combined config — wider + longer budget + tuned grows.
#
# Takes whichever config performed best in exp3/exp4 and extends it:
#   - 4000-episode budget for deeper convergence
#   - 128 hidden units (wider, based on exp4)
#   - Two well-timed grows (ep ~2000 and ep ~3000)
#   - Softer prune (tau_prune=1e-5) to preserve more weights
#   - Stronger whiff bonus for better plume tracking
#   - Adjusted epsilon schedule for 4000-episode budget

name: exp5_best_combined
seed: 42

experiment:
  n_episodes: 4000
  eval_every: 500
  notes: >
    Best combined: 128-wide network, 4000 episodes, two eval-triggered grows
    (ep ~2000 and ~3000), softer prune. Consolidates all improvements from
    exp2-exp4 into one configuration.

simulator:
  dt: 0.1
  episode_length: 50
  domain_size: [20.0, 20.0]
  source_position: random
  source_strength: 5.0
  filament:
    diffusion_rate: 0.05
    decay_time: 30.0
    initial_radius: 0.01
    mass: 0.1
  wind:
    type: ornstein_uhlenbeck
    mean_speed: 1.0
    mean_direction: 0.0
    direction_volatility: 15.0
    speed_volatility: 0.2
    correlation_time: 2.0
  sensors:
    antenna_separation: 0.1
    antenna_forward_offset: 0.08
    noise_floor_sigma: 0.001
    saturation: 1.0
  agent:
    forward_speed: 0.5
    turn_rate: 90.0
    cast_amplitude: 30.0
  success_radius: 0.5

tokenization:
  vocabulary_version: v1
  concentration_bin_edges: [3.0, 6.0, 15.0, 45.0, 150.0, 600.0]
  wind_n_octants: 8
  wind_zero_threshold: 0.05
  actions:
    - forward
    - turn_left_15
    - turn_right_15
    - turn_around
    - cast_left
    - cast_right

rl_agent:
  algorithm: expected_sarsa_nn
  network:
    hidden_dim: 128
    learning_rate: 1.0e-3
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.9996          # ε≈0.20 at ep 2000, ε≈0.08 at ep 4000
  n_episodes: 4000
  max_steps_per_episode: 600
  eval_every_episodes: 500
  output_dir: checkpoints/gpf/
  reward:
    source_found: 100.0
    time_penalty: -0.01
    whiff_bonus: 1.0
    blank_penalty: -0.05
    whiff_threshold_multiplier: 3.0
    blank_penalty_duration: 2.0
    distance_shaping: 2.0

gpf_agent:
  output_dir: checkpoints/gpf/
  grow:
    eps_add: 0.03               # success rate improvement threshold
    M_add: 6
    cooldown_episodes: 1000     # eval_cooldown = 2 → 2-3 grows in 4000 eps
    min_episodes_before_grow: 2000  # first grow at ep ~2000
    max_hidden_layers: 6
    ema_beta: 0.9
  belief:
    tau_belief_harden: 0.02
    tau_belief_prune: 0.3
  prune:
    tau_prune: 1.0e-5           # softest prune — preserve more weights
    prune_accum_steps: 1500
  freeze:
    tau_freeze_delta: 0.005
    tau_freeze_frac: 0.95
    freeze_check_interval: 300
    freeze_patience: 5
    min_episodes_before_freeze: 500
