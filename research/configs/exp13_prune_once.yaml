# Experiment 13: 64-wide, 4-layer max, 8000 eps, max_prune_events=1.
#
# Exp12 diagnosis: cascading pruning after each grow is catastrophically destructive.
#   1st prune (1 layer):  kept 49.73%  → policy fine
#   2nd prune (2 layers): kept 17.33%  → severe crash
#   3rd prune (3 layers): kept 10.88%  → near-total destruction (stuck at 55-58%)
#
# Root cause: _prune_preceding_layers() prunes ALL n_hidden-1 layers after every grow.
# Old trained layers get re-pruned alongside new near-identity layers whose weights are
# too small to have meaningful saliency — dragging down the overall keep ratio.
#
# Fix: max_prune_events=1. Only the 1st grow triggers OBD pruning (beneficial: keeps
# ~50% of the initial layer, removing genuinely unimportant connections). All
# subsequent grows grow depth WITHOUT re-pruning the already-sparse trained layers.
#
# Expected behavior:
#   ep1000:  1st grow (9%), 1st prune fires (1 layer, ~50% kept)
#   ep4500+: 2nd grow fires (stagnation ~90%), NO prune → 2-layer stays intact
#   ep5500+: 3rd grow fires (stagnation), NO prune → 3-layer stays intact
#   ep5500-8000: 4-layer dense-ish network (only layer 0 is sparse) converges
#
# Hypothesis: depth without cascading prune destruction beats the 2-layer sparse
# ceiling of 94.5%.

name: exp13_prune_once
seed: 42

experiment:
  n_episodes: 8000
  eval_every: 500
  notes: >
    64-wide, 4-layer max, 8000 eps, max_prune_events=1. Only the 1st grow triggers
    OBD pruning; subsequent grows add depth without re-pruning trained layers.
    Tests whether depth without cascading prune destruction exceeds 94.5%.

simulator:
  dt: 0.1
  episode_length: 50
  domain_size: [20.0, 20.0]
  source_position: random
  source_strength: 5.0
  filament:
    diffusion_rate: 0.05
    decay_time: 30.0
    initial_radius: 0.01
    mass: 0.1
  wind:
    type: ornstein_uhlenbeck
    mean_speed: 1.0
    mean_direction: 0.0
    direction_volatility: 15.0
    speed_volatility: 0.2
    correlation_time: 2.0
  sensors:
    antenna_separation: 0.1
    antenna_forward_offset: 0.08
    noise_floor_sigma: 0.001
    saturation: 1.0
  agent:
    forward_speed: 0.5
    turn_rate: 90.0
    cast_amplitude: 30.0
  success_radius: 0.5

tokenization:
  vocabulary_version: v1
  concentration_bin_edges: [3.0, 6.0, 15.0, 45.0, 150.0, 600.0]
  wind_n_octants: 8
  wind_zero_threshold: 0.05
  actions:
    - forward
    - turn_left_15
    - turn_right_15
    - turn_around
    - cast_left
    - cast_right

rl_agent:
  algorithm: expected_sarsa_nn
  network:
    hidden_dim: 64
    learning_rate: 1.0e-3
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.9995
  n_episodes: 8000
  max_steps_per_episode: 600
  eval_every_episodes: 500
  output_dir: checkpoints/gpf/
  reward:
    source_found: 100.0
    time_penalty: -0.01
    whiff_bonus: 1.0
    blank_penalty: -0.05
    whiff_threshold_multiplier: 3.0
    blank_penalty_duration: 2.0
    distance_shaping: 2.0

gpf_agent:
  output_dir: checkpoints/gpf/
  grow:
    eps_add: 0.05
    M_add: 6
    cooldown_episodes: 400
    min_episodes_before_grow: 400
    max_hidden_layers: 4
    ema_beta: 0.9
    use_eval_trigger_only: true
  belief:
    tau_belief_harden: 0.02
    tau_belief_prune: 0.3
  prune:
    tau_prune: 1.0e-6
    prune_accum_steps: 1500
    max_prune_events: 1       # only prune after 1st grow; subsequent grows add depth cleanly
  freeze:
    tau_freeze_delta: 0.01
    tau_freeze_frac: 0.9
    freeze_check_interval: 300
    freeze_patience: 3
    min_episodes_before_freeze: 99999
