# Experiment 4: Wider initial network + refined reward shaping.
#
# Hypothesis: the 22→64→6 architecture may be too narrow for the 3000-episode
# budget. A wider seed layer (128 hidden) gives more representational capacity
# per grow event and may converge faster before the grow trigger fires.
# Also strengthens the whiff bonus to reward the agent more for detecting odor.
#
# Builds on exp3 best settings: optimizer fix, epsilon_decay=0.999, min_warmup=500.

name: exp4_wider_network
seed: 42

experiment:
  n_episodes: 3000
  eval_every: 500
  notes: >
    Wider network (hidden_dim=128). Stronger whiff_bonus=0.5 to reinforce
    staying on the plume. Larger prune_accum_steps=600 since wider layers
    need more gradient samples for reliable OBD saliency estimates.

simulator:
  dt: 0.1
  episode_length: 50
  domain_size: [20.0, 20.0]
  source_position: random
  source_strength: 1.0
  filament:
    diffusion_rate: 0.05
    decay_time: 30.0
    initial_radius: 0.01
    mass: 0.1
  wind:
    type: ornstein_uhlenbeck
    mean_speed: 1.0
    mean_direction: 0.0
    direction_volatility: 15.0
    speed_volatility: 0.2
    correlation_time: 2.0
  sensors:
    antenna_separation: 0.1
    antenna_forward_offset: 0.08
    noise_floor_sigma: 0.001
    saturation: 1.0
  agent:
    forward_speed: 0.5
    turn_rate: 90.0
    cast_amplitude: 30.0
  success_radius: 0.5

tokenization:
  vocabulary_version: v1
  concentration_bin_edges: [3.0, 6.0, 15.0, 45.0, 150.0, 600.0]
  wind_n_octants: 8
  wind_zero_threshold: 0.05
  actions:
    - forward
    - turn_left_15
    - turn_right_15
    - turn_around
    - cast_left
    - cast_right

rl_agent:
  algorithm: expected_sarsa_nn
  network:
    hidden_dim: 128              # wider: 22→128→6 seed architecture
    learning_rate: 1.0e-3
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.999
  n_episodes: 3000
  max_steps_per_episode: 600
  eval_every_episodes: 500
  output_dir: checkpoints/gpf/
  reward:
    source_found: 100.0
    time_penalty: -0.01
    whiff_bonus: 0.5             # stronger: reward staying on plume
    blank_penalty: -0.05
    whiff_threshold_multiplier: 3.0
    blank_penalty_duration: 2.0

gpf_agent:
  output_dir: checkpoints/gpf/
  grow:
    eps_add: 0.008
    M_add: 30
    cooldown_episodes: 300
    min_episodes_before_grow: 500
    max_hidden_layers: 6
    ema_beta: 0.9
  belief:
    tau_belief_harden: 0.02
    tau_belief_prune: 0.3
  prune:
    tau_prune: 1.0e-8
    prune_accum_steps: 600       # wider layers need more gradient samples
  freeze:
    tau_freeze_delta: 0.01
    tau_freeze_frac: 0.9
    freeze_check_interval: 200
    freeze_patience: 3
    min_episodes_before_freeze: 200
