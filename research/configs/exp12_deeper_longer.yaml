# Experiment 12: Same architecture as exp11 (64-wide, 4-layer max, chained grows)
# but 8000 episodes and tau_prune=1e-7 to fix the post-2nd-grow crash.
#
# Exp11 results (5000 eps, tau_prune=1e-6):
#   - 1st grow: ep1000 (9%), prune kept 49.66%
#   - 2-layer sparse peaked: 94.5% at ep4000 → beats 92.5% ceiling ✓
#   - 2nd grow: ep4000 (sr_improve=0.03, best_sr=94.5%)
#   - "PRUNE 2 layer(s) kept 42.06%" crashed policy to 56.5% at ep4500
#   - Only 1000 eps for 3-layer recovery → final 88.5%, max still 94.5%
#
# Exp12 fixes:
#   1. 8000 episodes: gives 3-layer 3000+ eps to recover and exceed 94.5%
#      after the 2nd grow fires at ep~4000
#   2. tau_prune=1e-7: multi-layer prune keeps ~62% (vs 42%) → less disruption
#      when 2 layers are pruned simultaneously after the 2nd grow
#
# Expected timeline:
#   ep0-1000:   1-layer baseline
#   ep1000:     grow to 2-layer (9% policy)
#   ep1000-4000: 2-layer sparse converges (expected peak ~94.5%)
#   ep4000:     grow to 3-layer (stagnation trigger: sr_improve<5% vs best_early)
#   ep4000-4500: post-grow + prune disruption (tau_prune=1e-7 → softer crash)
#   ep4500-8000: 3-layer sparse converges (~3500 eps) → target >94.5%

name: exp12_deeper_longer
seed: 42

experiment:
  n_episodes: 5000
  eval_every: 500
  notes: >
    64-wide, 4-layer max, 5000 eps (re-run; 8000 caused catastrophic collapse at
    ep8000 from cascading prune destruction). 5000 eps captures full 2-layer
    sparse convergence (peak ~90.5%) without entering the destructive 4-layer phase.

simulator:
  dt: 0.1
  episode_length: 50
  domain_size: [20.0, 20.0]
  source_position: random
  source_strength: 5.0
  filament:
    diffusion_rate: 0.05
    decay_time: 30.0
    initial_radius: 0.01
    mass: 0.1
  wind:
    type: ornstein_uhlenbeck
    mean_speed: 1.0
    mean_direction: 0.0
    direction_volatility: 15.0
    speed_volatility: 0.2
    correlation_time: 2.0
  sensors:
    antenna_separation: 0.1
    antenna_forward_offset: 0.08
    noise_floor_sigma: 0.001
    saturation: 1.0
  agent:
    forward_speed: 0.5
    turn_rate: 90.0
    cast_amplitude: 30.0
  success_radius: 0.5

tokenization:
  vocabulary_version: v1
  concentration_bin_edges: [3.0, 6.0, 15.0, 45.0, 150.0, 600.0]
  wind_n_octants: 8
  wind_zero_threshold: 0.05
  actions:
    - forward
    - turn_left_15
    - turn_right_15
    - turn_around
    - cast_left
    - cast_right

rl_agent:
  algorithm: expected_sarsa_nn
  network:
    hidden_dim: 64
    learning_rate: 1.0e-3
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.9995
  n_episodes: 5000
  max_steps_per_episode: 600
  eval_every_episodes: 500
  output_dir: checkpoints/gpf/
  reward:
    source_found: 100.0
    time_penalty: -0.01
    whiff_bonus: 1.0
    blank_penalty: -0.05
    whiff_threshold_multiplier: 3.0
    blank_penalty_duration: 2.0
    distance_shaping: 2.0

gpf_agent:
  output_dir: checkpoints/gpf/
  grow:
    eps_add: 0.05
    M_add: 6
    cooldown_episodes: 400
    min_episodes_before_grow: 400
    max_hidden_layers: 4
    ema_beta: 0.9
    use_eval_trigger_only: true
  belief:
    tau_belief_harden: 0.02
    tau_belief_prune: 0.3
  prune:
    tau_prune: 1.0e-7        # more conservative: keeps ~62% per layer vs 42% in exp11
    prune_accum_steps: 1500
  freeze:
    tau_freeze_delta: 0.01
    tau_freeze_frac: 0.9
    freeze_check_interval: 300
    freeze_patience: 3
    min_episodes_before_freeze: 99999
