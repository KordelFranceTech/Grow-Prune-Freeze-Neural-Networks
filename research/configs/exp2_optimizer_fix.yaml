# Experiment 2: Environment fixes + reward shaping.
#
# Problems identified from Exp 1 + early Exp 2 runs:
#   A) OOB termination: agent goes out of bounds constantly → fixed by reflecting walls
#   B) Sparse plume signal: source_strength=1.0 gives barely detectable concentration
#      at 3-6m starting distance → agent gets almost no whiff signals to learn from
#   C) No dense reward: success is ~0-1%, so the agent almost never sees +100 signal
#
# Fixes applied in this experiment:
#   1. Reflecting walls (simulator/filament_sim.py) — from Exp 2 run 1
#   2. source_strength: 1.0 → 5.0  — 5× denser plume, reliable detection at 3-6m
#   3. distance_shaping: 2.0  — dense reward for moving closer to source
#      (Φ = -λ·dist, shaping = λ·(prev_dist - curr_dist) per step)
#   4. whiff_bonus: 0.3 → 1.0  — stronger incentive for staying on plume
#   5. No GPF grows (min_episodes_before_grow=99999) — stable single-layer training

name: exp2_env_fix_reward_shaping
seed: 42

experiment:
  n_episodes: 3000
  eval_every: 500
  notes: >
    Environmental fixes: reflecting walls, 5x denser plume, distance shaping,
    stronger whiff reward. No GPF grows. Goal: demonstrate stable single-layer
    convergence above Exp 1 best (13.5% on broken environment).

simulator:
  dt: 0.1
  episode_length: 50
  domain_size: [20.0, 20.0]
  source_position: random
  source_strength: 5.0           # 5x denser plume → reliable detection at 3-6m
  filament:
    diffusion_rate: 0.05
    decay_time: 30.0
    initial_radius: 0.01
    mass: 0.1
  wind:
    type: ornstein_uhlenbeck
    mean_speed: 1.0
    mean_direction: 0.0
    direction_volatility: 15.0
    speed_volatility: 0.2
    correlation_time: 2.0
  sensors:
    antenna_separation: 0.1
    antenna_forward_offset: 0.08
    noise_floor_sigma: 0.001
    saturation: 1.0
  agent:
    forward_speed: 0.5
    turn_rate: 90.0
    cast_amplitude: 30.0
  success_radius: 0.5

tokenization:
  vocabulary_version: v1
  concentration_bin_edges: [3.0, 6.0, 15.0, 45.0, 150.0, 600.0]
  wind_n_octants: 8
  wind_zero_threshold: 0.05
  actions:
    - forward
    - turn_left_15
    - turn_right_15
    - turn_around
    - cast_left
    - cast_right

rl_agent:
  algorithm: expected_sarsa_nn
  network:
    hidden_dim: 64
    learning_rate: 1.0e-3
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.9995
  n_episodes: 3000
  max_steps_per_episode: 600
  eval_every_episodes: 500
  output_dir: checkpoints/gpf/
  reward:
    source_found: 100.0
    time_penalty: -0.01
    whiff_bonus: 1.0             # 3x stronger: stay on the plume
    blank_penalty: -0.05
    whiff_threshold_multiplier: 3.0
    blank_penalty_duration: 2.0
    distance_shaping: 2.0        # 2.0 × (prev_dist - curr_dist) per step

gpf_agent:
  output_dir: checkpoints/gpf/
  grow:
    eps_add: 0.005
    M_add: 50
    cooldown_episodes: 200
    min_episodes_before_grow: 99999  # no grows — stable single-layer training
    max_hidden_layers: 6
    ema_beta: 0.9
  belief:
    tau_belief_harden: 0.02
    tau_belief_prune: 0.3
  prune:
    tau_prune: 1.0e-6
    prune_accum_steps: 1000
  freeze:
    tau_freeze_delta: 0.01
    tau_freeze_frac: 0.9
    freeze_check_interval: 300
    freeze_patience: 3
    min_episodes_before_freeze: 100
