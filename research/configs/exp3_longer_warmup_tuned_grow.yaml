# Experiment 3: Tuned grow trigger on top of the exp2 improvements.
#
# Observation from exp2: with a 3000-episode budget and min_episodes_before_grow=300,
# the agent only gets ~700 episodes of single-layer learning before grow is possible.
# Hypothesis: letting the single-layer network converge longer before growing
# produces a better scaffold for the added layer (better near-identity target).
#
# Changes vs exp2:
#   - min_episodes_before_grow: 300 → 500  (16% warmup on 3000-ep budget)
#   - cooldown_episodes: 200 → 300         (cap at ~8 grows max in 3000 eps)
#   - eps_add: 0.005 → 0.008               (slightly more eager grow trigger)
#   - M_add: 50 → 30                       (shorter TD window, faster trigger)
#   - lr: 1e-3 → 3e-3                      (faster initial learning, Adam handles it)

name: exp3_longer_warmup_tuned_grow
seed: 42

experiment:
  n_episodes: 3000
  eval_every: 500
  notes: >
    Extended single-layer warmup (500 eps) so the seed layer is better trained
    before the first grow. Faster grow response (M_add=30, eps_add=0.008).
    Higher lr=3e-3 for faster initial convergence.

simulator:
  dt: 0.1
  episode_length: 50
  domain_size: [20.0, 20.0]
  source_position: random
  source_strength: 1.0
  filament:
    diffusion_rate: 0.05
    decay_time: 30.0
    initial_radius: 0.01
    mass: 0.1
  wind:
    type: ornstein_uhlenbeck
    mean_speed: 1.0
    mean_direction: 0.0
    direction_volatility: 15.0
    speed_volatility: 0.2
    correlation_time: 2.0
  sensors:
    antenna_separation: 0.1
    antenna_forward_offset: 0.08
    noise_floor_sigma: 0.001
    saturation: 1.0
  agent:
    forward_speed: 0.5
    turn_rate: 90.0
    cast_amplitude: 30.0
  success_radius: 0.5

tokenization:
  vocabulary_version: v1
  concentration_bin_edges: [3.0, 6.0, 15.0, 45.0, 150.0, 600.0]
  wind_n_octants: 8
  wind_zero_threshold: 0.05
  actions:
    - forward
    - turn_left_15
    - turn_right_15
    - turn_around
    - cast_left
    - cast_right

rl_agent:
  algorithm: expected_sarsa_nn
  network:
    hidden_dim: 64
    learning_rate: 3.0e-3        # higher lr for faster early convergence
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.999
  n_episodes: 3000
  max_steps_per_episode: 600
  eval_every_episodes: 500
  output_dir: checkpoints/gpf/
  reward:
    source_found: 100.0
    time_penalty: -0.01
    whiff_bonus: 0.3
    blank_penalty: -0.05
    whiff_threshold_multiplier: 3.0
    blank_penalty_duration: 2.0

gpf_agent:
  output_dir: checkpoints/gpf/
  grow:
    eps_add: 0.008               # more eager: grow when improvement nearly stalled
    M_add: 30                    # shorter window for faster trigger response
    cooldown_episodes: 300       # space grows out across the budget
    min_episodes_before_grow: 500  # let seed layer converge before first grow
    max_hidden_layers: 6
    ema_beta: 0.9
  belief:
    tau_belief_harden: 0.02
    tau_belief_prune: 0.3
  prune:
    tau_prune: 1.0e-8
    prune_accum_steps: 300       # prune sooner after grow (fewer steps needed)
  freeze:
    tau_freeze_delta: 0.01
    tau_freeze_frac: 0.9
    freeze_check_interval: 200   # check stability more frequently
    freeze_patience: 3
    min_episodes_before_freeze: 200
