# Experiment 3: Adds one well-timed GPF grow to the stable Exp 2 setup.
#
# Exp 2 uses: reflecting walls, source_strength=5, distance_shaping=2.0, no grows.
# Exp 3 hypothesis: after the single-layer converges (~ep 2000), adding one
# hidden layer with near-identity init lets the agent learn a more refined
# policy in the remaining 1000 episodes.
#
# GPF grow trigger: eval-success-rate based (notify_eval in run_experiment.py)
# - First grow eligible at ep 2000
# - Grow fires when success rate improvement < 3% over recent eval history

name: exp3_single_grow
seed: 42

experiment:
  n_episodes: 3000
  eval_every: 500
  notes: >
    One GPF grow at ep ~2000 (eval-triggered). Same env fixes as exp2.
    Tests whether depth increase after single-layer convergence improves results.

simulator:
  dt: 0.1
  episode_length: 50
  domain_size: [20.0, 20.0]
  source_position: random
  source_strength: 5.0
  filament:
    diffusion_rate: 0.05
    decay_time: 30.0
    initial_radius: 0.01
    mass: 0.1
  wind:
    type: ornstein_uhlenbeck
    mean_speed: 1.0
    mean_direction: 0.0
    direction_volatility: 15.0
    speed_volatility: 0.2
    correlation_time: 2.0
  sensors:
    antenna_separation: 0.1
    antenna_forward_offset: 0.08
    noise_floor_sigma: 0.001
    saturation: 1.0
  agent:
    forward_speed: 0.5
    turn_rate: 90.0
    cast_amplitude: 30.0
  success_radius: 0.5

tokenization:
  vocabulary_version: v1
  concentration_bin_edges: [3.0, 6.0, 15.0, 45.0, 150.0, 600.0]
  wind_n_octants: 8
  wind_zero_threshold: 0.05
  actions:
    - forward
    - turn_left_15
    - turn_right_15
    - turn_around
    - cast_left
    - cast_right

rl_agent:
  algorithm: expected_sarsa_nn
  network:
    hidden_dim: 64
    learning_rate: 1.0e-3
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.9995
  n_episodes: 3000
  max_steps_per_episode: 600
  eval_every_episodes: 500
  output_dir: checkpoints/gpf/
  reward:
    source_found: 100.0
    time_penalty: -0.01
    whiff_bonus: 1.0
    blank_penalty: -0.05
    whiff_threshold_multiplier: 3.0
    blank_penalty_duration: 2.0
    distance_shaping: 2.0

gpf_agent:
  output_dir: checkpoints/gpf/
  grow:
    eps_add: 0.03               # grow when success rate hasn't improved by 3%
    M_add: 6
    cooldown_episodes: 2000     # eval_cooldown = max(2, 4) = 4 evals → 1 grow
    min_episodes_before_grow: 2000
    max_hidden_layers: 6
    ema_beta: 0.9
  belief:
    tau_belief_harden: 0.02
    tau_belief_prune: 0.3
  prune:
    tau_prune: 1.0e-6
    prune_accum_steps: 1000
  freeze:
    tau_freeze_delta: 0.005
    tau_freeze_frac: 0.95
    freeze_check_interval: 300
    freeze_patience: 5
    min_episodes_before_freeze: 300
