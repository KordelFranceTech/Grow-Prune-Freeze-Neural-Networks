# Experiment 9: 128-wide, eval-triggered grow at ep~1000, max 2 layers, 5000 eps.
#
# Exp7: 64-wide, grow ep1000, max 6 layers, 5000 eps → 92.5% best
# Exp8: 64-wide, grow ep1000, max 2 layers, 5000 eps → 92.5% (stable, no 2nd grow)
#
# Exp9 hypothesis: 128-wide 2-layer gives more representational capacity than
# 64-wide 2-layer. The single-layer 128-wide oscillated (exp4: 85.5%) because
# Adam lr=1e-3 is too high for that many parameters. But a 2-layer 128-wide
# grown from a small base (9% success) should be more stable:
#   - Layer 1 (128-wide) initializes from scratch (normal)
#   - Layer 2 (128→128) grows near-identity at ep~1000 (9% policy)
#   - Both layers co-adapt with 4000 remaining episodes
# The wider hidden representation should allow more nuanced policy encoding.

name: exp9_wider_two_layer
seed: 42

experiment:
  n_episodes: 5000
  eval_every: 500
  notes: >
    128-wide, eval-triggered grow at ep~1000 (same stagnation trigger as exp7/8),
    max_hidden_layers=2 (no 2nd grow). 5000 eps. Tests whether wider 2-layer
    exceeds 64-wide 2-layer ceiling of 92.5%.

simulator:
  dt: 0.1
  episode_length: 50
  domain_size: [20.0, 20.0]
  source_position: random
  source_strength: 5.0
  filament:
    diffusion_rate: 0.05
    decay_time: 30.0
    initial_radius: 0.01
    mass: 0.1
  wind:
    type: ornstein_uhlenbeck
    mean_speed: 1.0
    mean_direction: 0.0
    direction_volatility: 15.0
    speed_volatility: 0.2
    correlation_time: 2.0
  sensors:
    antenna_separation: 0.1
    antenna_forward_offset: 0.08
    noise_floor_sigma: 0.001
    saturation: 1.0
  agent:
    forward_speed: 0.5
    turn_rate: 90.0
    cast_amplitude: 30.0
  success_radius: 0.5

tokenization:
  vocabulary_version: v1
  concentration_bin_edges: [3.0, 6.0, 15.0, 45.0, 150.0, 600.0]
  wind_n_octants: 8
  wind_zero_threshold: 0.05
  actions:
    - forward
    - turn_left_15
    - turn_right_15
    - turn_around
    - cast_left
    - cast_right

rl_agent:
  algorithm: expected_sarsa_nn
  network:
    hidden_dim: 128
    learning_rate: 1.0e-3
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.9995
  n_episodes: 5000
  max_steps_per_episode: 600
  eval_every_episodes: 500
  output_dir: checkpoints/gpf/
  reward:
    source_found: 100.0
    time_penalty: -0.01
    whiff_bonus: 1.0
    blank_penalty: -0.05
    whiff_threshold_multiplier: 3.0
    blank_penalty_duration: 2.0
    distance_shaping: 2.0

gpf_agent:
  output_dir: checkpoints/gpf/
  grow:
    eps_add: 0.03
    M_add: 6
    cooldown_episodes: 500
    min_episodes_before_grow: 500
    max_hidden_layers: 2              # cap at 2-layer
    ema_beta: 0.9
    use_eval_trigger_only: true
  belief:
    tau_belief_harden: 0.02
    tau_belief_prune: 0.3
  prune:
    tau_prune: 1.0e-8           # 128-wide has smaller per-weight gradients → need lower threshold
    prune_accum_steps: 3000     # accumulate more steps before pruning for wider networks
  freeze:
    tau_freeze_delta: 0.01
    tau_freeze_frac: 0.9
    freeze_check_interval: 300
    freeze_patience: 3
    min_episodes_before_freeze: 99999
