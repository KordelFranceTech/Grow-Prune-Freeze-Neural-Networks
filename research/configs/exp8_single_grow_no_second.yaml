# Experiment 8: Same as exp7 but max_hidden_layers=2 (no second grow).
#
# Exp7: 5000 eps, grow at ep1000 (9%) → peak 92.5% at ep3500, then 2nd grow at
#       ep4500 crashed to 46% in the final 500 eps. Best was 92.5%.
#
# Exp8 hypothesis: by capping max_hidden_layers=2, the second grow never fires.
# The 2-layer network gets all 4000 remaining episodes (ep1000-5000) to converge,
# without any disruption from a 3rd layer. Expected peak: 93-95%.
#
# Same eval-triggered grow: fires at ep~1000 when 7%→9% stagnation < 3%.
# use_eval_trigger_only=true prevents TD-error trigger.

name: exp8_single_grow_capped
seed: 42

experiment:
  n_episodes: 5000
  eval_every: 500
  notes: >
    Same as exp7 (64-wide, lr=1e-3, eval-triggered grow at ep~1000) but
    max_hidden_layers=2 prevents the disruptive 2nd grow. 2-layer network
    gets full 4000 eps post-grow to converge. Target: >92.5%.

simulator:
  dt: 0.1
  episode_length: 50
  domain_size: [20.0, 20.0]
  source_position: random
  source_strength: 5.0
  filament:
    diffusion_rate: 0.05
    decay_time: 30.0
    initial_radius: 0.01
    mass: 0.1
  wind:
    type: ornstein_uhlenbeck
    mean_speed: 1.0
    mean_direction: 0.0
    direction_volatility: 15.0
    speed_volatility: 0.2
    correlation_time: 2.0
  sensors:
    antenna_separation: 0.1
    antenna_forward_offset: 0.08
    noise_floor_sigma: 0.001
    saturation: 1.0
  agent:
    forward_speed: 0.5
    turn_rate: 90.0
    cast_amplitude: 30.0
  success_radius: 0.5

tokenization:
  vocabulary_version: v1
  concentration_bin_edges: [3.0, 6.0, 15.0, 45.0, 150.0, 600.0]
  wind_n_octants: 8
  wind_zero_threshold: 0.05
  actions:
    - forward
    - turn_left_15
    - turn_right_15
    - turn_around
    - cast_left
    - cast_right

rl_agent:
  algorithm: expected_sarsa_nn
  network:
    hidden_dim: 64
    learning_rate: 1.0e-3
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.9995
  n_episodes: 5000
  max_steps_per_episode: 600
  eval_every_episodes: 500
  output_dir: checkpoints/gpf/
  reward:
    source_found: 100.0
    time_penalty: -0.01
    whiff_bonus: 1.0
    blank_penalty: -0.05
    whiff_threshold_multiplier: 3.0
    blank_penalty_duration: 2.0
    distance_shaping: 2.0

gpf_agent:
  output_dir: checkpoints/gpf/
  grow:
    eps_add: 0.03
    M_add: 6
    cooldown_episodes: 500
    min_episodes_before_grow: 500
    max_hidden_layers: 2              # cap at 2-layer — no 2nd grow
    ema_beta: 0.9
    use_eval_trigger_only: true
  belief:
    tau_belief_harden: 0.02
    tau_belief_prune: 0.3
  prune:
    tau_prune: 1.0e-6
    prune_accum_steps: 1200
  freeze:
    tau_freeze_delta: 0.01
    tau_freeze_frac: 0.9
    freeze_check_interval: 300
    freeze_patience: 3
    min_episodes_before_freeze: 99999
